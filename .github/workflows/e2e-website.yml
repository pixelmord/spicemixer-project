name: E2E – website

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/website/**"
      - "packages/content-ai/**"
      - "packages/content-ai-core/**"
      - "packages/content-ai-ingest/**"
      - "packages/content-ai-refine/**"
      - "packages/entity-kind/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/e2e-website.yml"

jobs:
  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AI_PROVIDER: mock
      AI_API_KEY: mock
      AI_BASE_URL: http://mock.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter website exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter website e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/website/playwright-report/
          retention-days: 14

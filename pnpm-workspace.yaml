packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  esbuild: true
  sharp: true

catalog:
  "@astrojs/react": ^5.0.4
  "@tailwindcss/vite": ^4.2.4
  "@types/node": ^24
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  react: ^19.2.5
  react-dom: ^19.2.5
  tailwindcss: ^4.2.4
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  zod: "^3"

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  esbuild: true
  msw: true
  sharp: true

catalog:
  "@astrojs/react": ^5.0.4
  "@base-ui/react": ^1.4.1
  "@fontsource-variable/geist": ^5.2.8
  "@tailwindcss/vite": ^4.2.4
  "@types/node": ^24
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  next-themes: ^0.4.6
  react: ^19.2.5
  react-dom: ^19.2.5
  shadcn: ^4.5.0
  sonner: ^2.0.7
  tailwindcss: ^4.2.4
  tw-animate-css: ^1.4.0
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  zod: "^3"

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
